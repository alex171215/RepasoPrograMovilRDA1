<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Programación Móvil RDA1</title>
    <meta name="description" content="Cuestionario interactivo para repasar conceptos de Programación Móvil RDA1 - Kotlin, Android, OOP y Programación Funcional">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- PANTALLA DE SELECCIÓN DE BANCO -->
    <div id="screen-selection" class="screen-selection">
        <div class="selection-container">
            <div class="selection-header">
                <h1>📱 Repaso Móvil RDA1</h1>
                <p>Selecciona el banco de preguntas que quieres estudiar</p>
            </div>
            <div class="bank-grid">
                <button class="bank-card" id="bank-all" onclick="selectBank('all')">
                    <div class="bank-icon">🌐</div>
                    <div class="bank-info">
                        <h3>Banco Completo</h3>
                        <span class="bank-count">50 preguntas del Ejemplo</span>
                        <p>Preguntas del archivo Ejemplo Preguntas original</p>
                    </div>
                    <div class="bank-arrow"><i data-lucide="chevron-right"></i></div>
                </button>
                <button class="bank-card" id="bank-1" onclick="selectBank('week1')">
                    <div class="bank-icon">🏗️</div>
                    <div class="bank-info">
                        <h3>Semana 1</h3>
                        <span class="bank-count">40 preguntas</span>
                        <p>Ecosistema Móvil: Kernel, ART, iOS vs Android, Seguridad</p>
                    </div>
                    <div class="bank-arrow"><i data-lucide="chevron-right"></i></div>
                </button>
                <button class="bank-card" id="bank-2" onclick="selectBank('week2')">
                    <div class="bank-icon">🛡️</div>
                    <div class="bank-info">
                        <h3>Semana 2</h3>
                        <span class="bank-count">40 preguntas</span>
                        <p>Kotlin: Tipos, val/var, Null Safety, when, Estilo</p>
                    </div>
                    <div class="bank-arrow"><i data-lucide="chevron-right"></i></div>
                </button>
                <button class="bank-card" id="bank-3" onclick="selectBank('week3')">
                    <div class="bank-icon">⚙️</div>
                    <div class="bank-info">
                        <h3>Semana 3</h3>
                        <span class="bank-count">40 preguntas</span>
                        <p>Kotlin Avanzado: Data Classes, Sealed, Lambdas, Scope Functions</p>
                    </div>
                    <div class="bank-arrow"><i data-lucide="chevron-right"></i></div>
                </button>
                <button class="bank-card bank-card-full" id="bank-all-new" onclick="selectBank('allNew')">
                    <div class="bank-icon">🚀</div>
                    <div class="bank-info">
                        <h3>Todo el Contenido</h3>
                        <span class="bank-count">170 preguntas</span>
                        <p>Las 50 del Ejemplo + 40 de cada semana (1, 2 y 3)</p>
                    </div>
                    <div class="bank-arrow"><i data-lucide="chevron-right"></i></div>
                </button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DEL CUESTIONARIO -->
    <main class="app-container hidden" id="screen-quiz">
        <header class="header">
            <div class="header-top">
                <div class="title-area">
                    <button id="btn-home" class="icon-btn" title="Cambiar banco de preguntas">
                        <i data-lucide="home"></i>
                    </button>
                    <h1 id="app-title">Repaso Móvil RDA1</h1>
                </div>
                <div class="actions">
                    <button id="btn-reset" class="icon-btn" title="Reiniciar Progreso">
                        <i data-lucide="rotate-ccw"></i>
                    </button>
                    <button id="btn-filter" class="icon-btn" title="Modo Repaso (Marcadas/Erróneas)">
                        <i data-lucide="filter"></i>
                    </button>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar-wrapper">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div class="progress-stats">
                    <span id="question-counter">Pregunta 1 de 50</span>
                    <span id="score-counter">Puntuación: 0</span>
                </div>
            </div>
            
            <div id="filter-mode-banner" class="banner hidden">
                <i data-lucide="alert-circle"></i>
                <span>Modo de repaso activado (Marcadas/Erróneas)</span>
                <button id="btn-exit-filter" class="text-btn">Salir</button>
            </div>
        </header>

        <section class="card glass-panel">
            <div class="question-header">
                <span class="badge" id="badge-status">Sin responder</span>
                <button id="btn-bookmark" class="icon-btn bookmark-btn" title="Marcar pregunta">
                    <i data-lucide="bookmark"></i>
                </button>
            </div>
            
            <h2 id="question-text" class="question-text">Cargando pregunta...</h2>

            <div id="options-container" class="options-list">
                <!-- Opciones se renderizan aquí dinámicamente -->
            </div>

            <div id="feedback-container" class="feedback-box hidden">
                <div class="feedback-header">
                    <i id="feedback-icon" data-lucide="info"></i>
                    <h3 id="feedback-title">Resultado</h3>
                </div>
                <p id="feedback-text"></p>
            </div>
        </section>

        <footer class="navigation">
            <button id="btn-prev" class="btn btn-secondary" disabled>
                <i data-lucide="arrow-left"></i> Anterior
            </button>
            <button id="btn-next" class="btn btn-primary">
                Siguiente <i data-lucide="arrow-right"></i>
            </button>
        </footer>
    </main>

    <!-- Scripts de preguntas -->
    <script src="questions.js"></script>
    <script src="questions_week1.js"></script>
    <script src="questions_week2.js"></script>
    <script src="questions_week3.js"></script>
    <script src="app.js"></script>
</body>
</html>
